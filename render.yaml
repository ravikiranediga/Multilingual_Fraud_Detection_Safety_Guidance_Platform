services:
  - type: web
    name: scamshield-api
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements-backend.txt && python scripts/build_vector_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-lite"
